<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Chemistry Teacher — an interactive story</title>
<style>
/* ============================================================
   DESERT NOIR — mobile-first
   ============================================================ */
:root{
  --bg0:#16110b;
  --bg1:#1d1610;
  --panel:#211a12;
  --panel-edge:#3a2e1e;
  --ink:#e8e0d0;
  --ink-dim:#9c917c;
  --amber:#e8a33d;
  --amber-dim:#a87526;
  --teal:#3da6a0;
  --teal-dim:#2a6f6b;
  --danger:#d65a3a;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Courier New",monospace;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(120% 90% at 50% 0%, var(--bg1) 0%, var(--bg0) 70%);
  color:var(--ink);
  font-family:var(--mono);
  font-size:16px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
}
button{
  font-family:inherit;font-size:inherit;color:inherit;
  background:none;border:none;cursor:pointer;
  touch-action:manipulation;
}

/* ---------- app frame ---------- */
#app{
  display:grid;
  grid-template-rows:auto 1fr auto;
  grid-template-areas:"hud" "narrative" "choices";
  height:100vh;
  height:100dvh;
  max-width:1100px;
  margin:0 auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ---------- HUD ---------- */
#hud{
  grid-area:hud;
  display:flex;flex-wrap:wrap;gap:6px;
  align-items:center;
  padding:8px 10px;
  border-bottom:1px solid var(--panel-edge);
  background:rgba(22,17,11,.92);
}
.pill{
  position:relative;
  flex:1 1 130px;
  min-width:118px;
  background:var(--panel);
  border:1px solid var(--panel-edge);
  border-radius:6px;
  padding:4px 8px 6px;
  font-size:12px;
  overflow:hidden;
}
.pill .lbl{display:flex;justify-content:space-between;color:var(--ink-dim);letter-spacing:.04em}
.pill .val{color:var(--ink);font-weight:bold}
.pill .bar{height:4px;border-radius:2px;background:#000;margin-top:4px;overflow:hidden}
.pill .bar i{display:block;height:100%;width:0;transition:width .5s ease, background .5s ease}
.pill[data-stat="money"] .val{color:var(--amber)}
.pill[data-stat="heat"] .bar i{background:var(--danger)}
.pill[data-stat="trust"] .bar i{background:var(--teal)}
.pill[data-stat="health"] .bar i{background:var(--teal)}
.pill.warn{border-color:var(--danger)}
.pill.warn .lbl{color:var(--danger)}
.pill .delta{
  position:absolute;right:8px;top:2px;font-weight:bold;
  animation:floatup 1.4s ease-out forwards;pointer-events:none;
}
.delta.up{color:var(--teal)} .delta.down{color:var(--danger)}
@keyframes floatup{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.pill.pulse{animation:pulse .6s ease}
@keyframes pulse{50%{border-color:var(--amber)}}
#bagBtn{
  flex:0 0 auto;
  border:1px solid var(--panel-edge);border-radius:6px;
  background:var(--panel);
  padding:8px 12px;min-height:40px;
  font-size:16px;
}

/* ---------- narrative ---------- */
#narrative{
  grid-area:narrative;
  overflow-y:auto;
  padding:20px 16px 28px;
  -webkit-overflow-scrolling:touch;
  cursor:pointer;
}
#narrative.fade{opacity:0;transform:translateY(8px)}
#narrative{transition:opacity .25s ease, transform .25s ease}
#speaker{
  display:none;
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  margin-bottom:14px;
}
#speaker.on{display:inline-block;border-bottom:1px solid currentColor;padding-bottom:2px}
#sceneText p{margin-bottom:1.1em;max-width:68ch}
#sceneText .cursor::after{content:"▌";color:var(--amber);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#skipHint{color:var(--ink-dim);font-size:11px;letter-spacing:.1em;margin-top:8px;opacity:.6}

/* ---------- choices ---------- */
#choices{
  grid-area:choices;
  display:flex;flex-direction:column;gap:8px;
  padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--panel-edge);
  background:rgba(22,17,11,.96);
  max-height:46vh;overflow-y:auto;
}
.choice{
  text-align:left;
  min-height:48px;
  padding:12px 14px;
  border:1px solid var(--amber-dim);
  border-radius:6px;
  background:linear-gradient(180deg,#2a2114,#231b10);
  color:var(--ink);
  line-height:1.4;
  opacity:0;transform:translateY(6px);
  transition:opacity .3s ease, transform .3s ease, border-color .15s;
}
.choice:not(.show){pointer-events:none}
.choice.show{opacity:1;transform:none}
@media (hover:hover){
  .choice:not(:disabled):hover{border-color:var(--amber);background:#322617}
}
.choice:not(:disabled):active{border-color:var(--amber)}
.choice .arrow{color:var(--amber);margin-right:8px}
.choice:disabled{
  border-color:var(--panel-edge);color:var(--ink-dim);
  background:var(--panel);cursor:not-allowed;
}
.choice:disabled .arrow{color:var(--ink-dim)}
.choice .hint{display:block;font-size:12px;color:var(--danger);margin-top:4px}

/* ---------- inventory (desktop sidebar + mobile sheet) ---------- */
#sidebar{display:none}
.inv-title{
  font-size:12px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-dim);margin-bottom:10px;
}
.inv-list{list-style:none}
.inv-list li{
  border:1px solid var(--panel-edge);border-radius:6px;
  background:var(--panel);
  padding:8px 10px;margin-bottom:8px;font-size:14px;
}
.inv-list li b{color:var(--amber);display:block}
.inv-list li span{color:var(--ink-dim);font-size:12px}
.inv-empty{color:var(--ink-dim);font-size:13px;font-style:italic}
.sysbtns{display:flex;gap:8px;margin-top:14px}
.sysbtn{
  flex:1;min-height:44px;
  border:1px solid var(--teal-dim);border-radius:6px;
  background:var(--panel);color:var(--teal);
  font-size:14px;letter-spacing:.05em;
}
@media (hover:hover){ .sysbtn:hover{border-color:var(--teal)} }

#sheet{
  position:fixed;inset:auto 0 0 0;z-index:40;
  background:var(--bg1);
  border-top:1px solid var(--amber-dim);
  border-radius:14px 14px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  max-height:70vh;max-height:70dvh;overflow-y:auto;
  transform:translateY(105%);
  transition:transform .28s ease;
}
#sheet.open{transform:none}
#sheetClose{
  width:100%;min-height:44px;margin-top:6px;
  color:var(--ink-dim);border:1px solid var(--panel-edge);border-radius:6px;
}
#scrim{
  position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
#scrim.on{opacity:1;pointer-events:auto}

/* ---------- overlay: chapter cards, endings, save modal ---------- */
#overlay{
  position:fixed;inset:0;z-index:50;
  display:none;
  align-items:center;justify-content:center;
  background:#0c0905;
  padding:24px;
  text-align:center;
}
#overlay.on{display:flex}
#overlay.fadein .card{animation:cardin 1.2s ease both}
@keyframes cardin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{max-width:560px;width:100%}
.card .kicker{
  font-size:13px;letter-spacing:.5em;text-transform:uppercase;
  color:var(--ink-dim);margin-bottom:14px;
}
.card h1{
  font-family:var(--serif);
  font-size:clamp(28px,7vw,44px);
  font-weight:normal;letter-spacing:.06em;
  color:var(--amber);
  margin-bottom:22px;
}
.card .body{text-align:left;margin:0 auto 20px;max-width:46ch}
.card .body p{margin-bottom:1em;font-size:15px}
.card .stats{
  font-size:13px;color:var(--ink-dim);
  border-top:1px solid var(--panel-edge);
  padding-top:14px;margin-bottom:20px;
}
.card .bigbtn{
  min-height:48px;padding:12px 34px;
  border:1px solid var(--amber-dim);border-radius:6px;
  color:var(--amber);letter-spacing:.2em;text-transform:uppercase;font-size:13px;
}
@media (hover:hover){ .card .bigbtn:hover{border-color:var(--amber);background:#241b0e} }
#overlay.end-peace{background:#081413} #overlay.end-peace h1{color:var(--teal)}
#overlay.end-doom{background:#170a06}  #overlay.end-doom h1{color:var(--danger)}
#overlay.end-empire{background:#171005}

/* save modal */
#saveModal{
  position:fixed;inset:0;z-index:60;display:none;
  align-items:center;justify-content:center;background:rgba(0,0,0,.7);padding:16px;
}
#saveModal.on{display:flex}
.modal{
  width:100%;max-width:520px;max-height:88vh;max-height:88dvh;overflow-y:auto;
  background:var(--bg1);border:1px solid var(--panel-edge);border-radius:10px;
  padding:18px;text-align:left;
}
.modal h2{font-family:var(--serif);color:var(--amber);font-weight:normal;margin-bottom:12px}
.modal label{display:block;font-size:12px;color:var(--ink-dim);letter-spacing:.1em;text-transform:uppercase;margin:12px 0 6px}
.modal textarea{
  width:100%;min-height:74px;resize:vertical;
  background:#0e0b07;border:1px solid var(--panel-edge);border-radius:6px;
  color:var(--ink);font-family:var(--mono);font-size:16px;padding:8px;
  word-break:break-all;
}
.modal .row{display:flex;gap:8px;margin-top:8px}
#saveMsg{font-size:13px;min-height:1.4em;margin-top:10px}
#saveMsg.ok{color:var(--teal)} #saveMsg.err{color:var(--danger)}

/* ---------- desktop ≥720px ---------- */
@media (min-width:720px){
  #app{
    grid-template-columns:1fr 260px;
    grid-template-rows:auto 1fr auto;
    grid-template-areas:"hud hud" "narrative sidebar" "choices sidebar";
    column-gap:0;
  }
  #bagBtn{display:none}
  #sheet,#scrim{display:none}
  #sidebar{
    display:block;grid-area:sidebar;
    border-left:1px solid var(--panel-edge);
    padding:18px 14px;overflow-y:auto;
  }
  #narrative{padding:30px 36px}
  #sceneText{max-width:68ch;margin:0 auto}
  #speakerWrap{max-width:68ch;margin:0 auto}
  #choices{padding:14px 36px 18px;max-height:none}
  .choice{max-width:68ch;width:100%;margin:0 auto}
}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="pill" data-stat="money"><div class="lbl"><span>MONEY</span><span class="val" id="v-money">$0</span></div><div class="bar"><i id="b-money" style="background:var(--amber)"></i></div></div>
    <div class="pill" data-stat="heat"><div class="lbl"><span>HEAT</span><span class="val" id="v-heat">0</span></div><div class="bar"><i id="b-heat"></i></div></div>
    <div class="pill" data-stat="trust"><div class="lbl"><span>FAMILY</span><span class="val" id="v-trust">0</span></div><div class="bar"><i id="b-trust"></i></div></div>
    <div class="pill" data-stat="health"><div class="lbl"><span>HEALTH</span><span class="val" id="v-health">0</span></div><div class="bar"><i id="b-health"></i></div></div>
    <button id="bagBtn" aria-label="Inventory and save menu">🎒</button>
  </header>

  <main id="narrative">
    <div id="speakerWrap"><span id="speaker"></span></div>
    <div id="sceneText"></div>
    <div id="skipHint">tap to skip ▸</div>
  </main>

  <div id="choices"></div>

  <aside id="sidebar">
    <div class="inv-title">Inventory</div>
    <ul class="inv-list" id="invDesktop"></ul>
    <div class="sysbtns">
      <button class="sysbtn" data-open-save>Save / Load</button>
    </div>
  </aside>
</div>

<div id="scrim"></div>
<div id="sheet">
  <div class="inv-title">Inventory</div>
  <ul class="inv-list" id="invSheet"></ul>
  <div class="sysbtns">
    <button class="sysbtn" data-open-save>Save / Load</button>
  </div>
  <button id="sheetClose">Close</button>
</div>

<div id="overlay">
  <div class="card">
    <div class="kicker" id="cardKicker"></div>
    <h1 id="cardTitle"></h1>
    <div class="body" id="cardBody"></div>
    <div class="stats" id="cardStats"></div>
    <button class="bigbtn" id="cardBtn"></button>
  </div>
</div>

<div id="saveModal">
  <div class="modal">
    <h2>Save / Load</h2>
    <label for="saveOut">Your save code — copy it somewhere safe</label>
    <textarea id="saveOut" readonly></textarea>
    <div class="row"><button class="sysbtn" id="copyBtn">Copy save code</button></div>
    <label for="saveIn">Paste a save code to load</label>
    <textarea id="saveIn" placeholder="Paste save code here…"></textarea>
    <div class="row">
      <button class="sysbtn" id="loadBtn">Load</button>
      <button class="sysbtn" id="closeSave">Close</button>
    </div>
    <div id="saveMsg"></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   SECTION 1: DATA
   All story content lives here. The engine below never needs
   to change to add scenes, items, characters, or events.

   NOTE ON CONTENT: anything involving "the cook" is deliberately
   a narrative black box. Keep it that way in all added scenes.
   ============================================================ */

const CHARACTERS = {
  walt:   { name:"Walter White",   color:"#e8a33d" },
  skyler: { name:"Skyler White",   color:"#9fd0cc" },
  jesse:  { name:"Jesse Pinkman",  color:"#3da6a0" },
  hank:   { name:"Hank Schrader",  color:"#d98f4a" },
  marie:  { name:"Marie Schrader", color:"#b58bd6" },
  waltjr: { name:"Walt Jr.",       color:"#c9b78a" },
  saul:   { name:"Saul Goodman",   color:"#e0c34a" },
  tuco:   { name:"Tuco Salamanca", color:"#d65a3a" },
};

const ITEMS = {
  family_photo:   { name:"Family Photo",   desc:"Framed at the birthday party. The three of them, smiling." },
  burner_phone:   { name:"Burner Phone",   desc:"Untraceable. In theory." },
  rv_keys:        { name:"RV Keys",        desc:"A 1986 Fleetwood Bounder. It runs. Mostly." },
  sauls_card:     { name:"Saul's Card",    desc:"\"Better Call Saul!\" A number that answers at 3 a.m." },
  heisenberg_hat: { name:"Pork-Pie Hat",   desc:"Black felt. You stand differently when it's on." },
};

const STATS_META = {
  money:  { label:"MONEY",  min:0, max:Infinity, barMax:50000 },
  heat:   { label:"HEAT",   min:0, max:100, barMax:100, warnHigh:70 },
  trust:  { label:"FAMILY", min:0, max:100, barMax:100, warnLow:25 },
  health: { label:"HEALTH", min:0, max:100, barMax:100, warnLow:25 },
};

/* ----- random events: rolled at each chapter card (ch.2+) ----- */
const EVENTS = [
  { id:"hank_dropby", scene:"evt_hank_dropby", once:false,
    require:{ stats:{ heat:{ gte:30 } } },
    weight:(s)=> 1 + s.stats.heat/25 },
  { id:"dealer_arrest", scene:"evt_dealer_arrest", once:true,
    require:{ flags:{ partnered:true } },
    weight:(s)=> 1 + s.stats.heat/40 },
  { id:"bill_due", scene:"evt_bill_due", once:false,
    weight:(s)=> s.stats.money < 6000 ? 2.2 : 1.2 },
  { id:"marie_tiara", scene:"evt_marie_tiara", once:true, weight:1 },
  { id:"waltjr_breakfast", scene:"evt_waltjr_breakfast", once:true,
    weight:(s)=> s.stats.trust < 50 ? 1.8 : 1 },
  { id:"jesse_trouble", scene:"evt_jesse_trouble", once:true,
    require:{ flags:{ partnered:true } }, weight:1.2 },
  { id:"krazy8_fallout", scene:"evt_krazy8_fallout", once:true,
    require:{ flags:{ spared_krazy8:true } }, weight:2.5 },
  { id:"saul_tip", scene:"evt_saul_tip", once:true,
    require:{ items:["sauls_card"] },
    weight:(s)=> s.stats.heat >= 40 ? 2 : 0.8 },
];
const NO_EVENT_WEIGHT = 2.5;

/* ----- the story graph ----- */
const STORY = {
  start: "ch1_card",
  scenes: {

  /* ==================== CHAPTER 1 — THE DIAGNOSIS ==================== */

  ch1_card: { type:"chapter", chapter:1, title:"The Diagnosis", next:"ch1_birthday" },

  ch1_birthday: {
    chapter:1,
    text:[
      "Fifty. The bacon on your plate is veggie bacon, arranged into the number by Skyler, who is smiling at you with the particular patience of a woman seven months pregnant. Walt Jr. grins over his orange juice. You teach chemistry to teenagers who don't care, you wash cars for men who were your students, and tonight your house fills up with people celebrating a life you can't quite remember choosing.",
      "At the party, your brother-in-law Hank holds court with his service pistol, passing it around like a party favor. \"Go ahead, Walt, it won't bite.\" Laughter. The TV plays his press footage — a record seizure, bricks of cash on a table. \"Seven hundred grand,\" Hank says. \"And that's a slow week for these clowns.\"",
      "Walt Jr. tugs your sleeve and hands you a small wrapped frame: a photo of the three of you at the Grand Canyon. \"Happy birthday, Dad.\"",
    ],
    onEnter:[ { item:"family_photo", op:"add" } ],
    choices:[
      { label:"Take the gun. Hold it. Feel the weight.",
        effects:[ { rel:"hank", delta:1 } ],
        goto:"ch1_carwash" },
      { label:"Wave it off and slip away to help Skyler in the kitchen.",
        effects:[ { stat:"trust", delta:5 }, { rel:"skyler", delta:1 } ],
        goto:"ch1_carwash" },
    ],
  },

  ch1_carwash: {
    chapter:1,
    text:[
      "Two weeks later you're on your knees at the car wash — the second job Skyler doesn't know is mostly wheel-buffing now — when one of your students pulls in with his girlfriend and photographs you crouched over his tire. The flash goes off like a verdict.",
      "Then the parking lot tilts. The sky slides sideways. You wake to a paramedic asking if you smoke, and an ambulance you already know you can't afford.",
    ],
    next:"ch1_diagnosis",
  },

  ch1_diagnosis: {
    chapter:1,
    text:[
      "The oncologist has a mustard stain on his lapel. You stare at it the whole time, because it is easier than his mouth, which is saying: inoperable. Lung cancer. Best case, with treatment — two years. The treatment itself: ninety thousand dollars, give or take, and your HMO will cover almost none of it.",
      "You drive home the long way. The desert out past the city doesn't care how long you've got. Somehow that helps.",
    ],
    choices:[
      { label:"Tell Skyler tonight. She deserves the truth.",
        effects:[ { flag:"told_cancer", value:true }, { stat:"trust", delta:8 }, { rel:"skyler", delta:1 } ],
        goto:"ch1_dinner" },
      { label:"Tell no one. Carry it alone for now.",
        effects:[ { flag:"hid_cancer", value:true }, { stat:"trust", delta:-8 } ],
        goto:"ch1_dinner" },
    ],
  },

  ch1_dinner: {
    chapter:1,
    text:(s)=> s.flags.told_cancer ? [
      "You tell her at the kitchen table after Walt Jr. is asleep. Skyler's hand finds yours and grips it hard enough to hurt, and for a long time neither of you says anything. Then she's all motion — second opinions, specialists, payment plans, a legal pad filling with numbers that all end in zeros you don't have.",
      "\"We'll figure out the money,\" she says. You watch her underline the word twice and know that she can't, and that she knows it too.",
    ] : [
      "Dinner is meatloaf. Skyler talks about the baby kicking; Walt Jr. complains about a teacher who isn't you. You sit inside the noise of your own family like a man behind glass, nodding at the right moments, and the secret sits in your chest with its own pulse.",
      "That night Skyler asks if you're okay. \"Tired,\" you say. The first lie is the easiest one you'll ever tell.",
    ],
    next:"ch1_elliott",
  },

  ch1_elliott: {
    chapter:1,
    speaker:null,
    text:(s)=>[
      "Gray Matter Technologies throws a birthday party for Elliott Schwartz that costs more than your house. You co-founded that company. You sold your share for five thousand dollars a lifetime ago, and the framed photos in the hallway have been cropped accordingly.",
      s.flags.told_cancer
        ? "Elliott takes you aside, kind and terrible. Skyler told Gretchen. Of course she did. \"Come work with us. Great insurance. Or — Walt — just let us cover the treatment. It's nothing to us. Please.\""
        : "Elliott takes you aside, kind and terrible. He's heard about the collapse from a mutual friend. \"Come back. Work with us. Whatever you need, Walt — health coverage, anything. It would be our privilege.\"",
      "It's everything you need. All it costs is everything you are.",
    ],
    choices:[
      { label:"Accept. Swallow your pride and take their money.",
        effects:[ { flag:"took_charity", value:true } ],
        goto:"ch1_accept" },
      { label:"Refuse. You will not live on charity from Gretchen and Elliott.",
        effects:[ { flag:"refused_charity", value:true }, { stat:"trust", delta:-5 } ],
        goto:"ch1_ridealong" },
    ],
  },

  ch1_accept: {
    chapter:1,
    text:[
      "You say yes. The word tastes like a tooth coming out.",
      "Gretchen hugs you at the door and you let her. On the drive home Skyler holds your hand at every red light, and you understand that you have just chosen the version of this story where everyone gets to keep you — and you don't get to become anything else.",
    ],
    next:"end_walk_away",
  },

  ch1_ridealong: {
    chapter:1,
    speaker:"hank",
    text:[
      "\"You want to see some real action, buddy?\" Hank's been offering for years, half-joke. This time you say yes, and he's so pleased he buys you gas-station coffee for the stakeout.",
      "The bust is fast and loud — DEA windbreakers, a battering ram, a man face-down on a lawn. You watch from the car. And then, from a window of the house next door, a skinny figure in baggy clothes drops onto a carport roof, slides down, and looks straight at you for one frozen second before sprinting away.",
      "You know that face. Pinkman, Jesse. Flunked your class twice. \"Apply yourself,\" you used to write on his exams.",
    ],
    choices:[
      { label:"Say nothing. Memorize the address on the mailbox.",
        effects:[ { flag:"knows_jesse", value:true } ],
        goto:"ch1_jesse" },
      { label:"Look away. This is not your world.",
        goto:"ch1_sleepless" },
    ],
  },

  ch1_sleepless: {
    chapter:1,
    text:[
      "For three nights you don't sleep. The hospital's estimate sits on the kitchen counter under the fruit bowl, where Skyler files things she refuses to be afraid of. Ninety thousand dollars. Hank's voice in your head: seven hundred grand. A slow week.",
      "You are a brilliant chemist who has spent twenty years being polite about it. There is a door in front of you, and the handle is shaped like a former student's name. You could still take Elliott's offer instead. The phone is right there.",
    ],
    choices:[
      { label:"Call Elliott. Take the money. Close the door.",
        effects:[ { flag:"took_charity", value:true } ],
        goto:"ch1_accept" },
      { label:"Find Pinkman.",
        effects:[ { flag:"knows_jesse", value:true } ],
        goto:"ch1_jesse" },
    ],
  },

  ch1_jesse: {
    chapter:1,
    speaker:"jesse",
    text:[
      "Jesse Pinkman opens his door, sees you, and tries to close it. Your foot is faster than your fifty-year-old knees have any right to be.",
      "\"Mr. White? Yo, this is — whatever this is, I didn't do it.\" He's wiry, jittery, eyes going past you to the street. You tell him what you saw at the bust. You watch the math happen on his face: teacher, DEA brother-in-law, my address.",
      "Then you say the sentence you've been rehearsing for three sleepless nights: \"I want in. You know the business. I know the chemistry.\"",
    ],
    choices:[

        effects:[ { flag:"partnered", value:true }, { rel:"jesse", delta:1 }, { item:"burner_phone", op:"add" } ],
        goto:"ch1_money" },
      { label:"Make it a threat. Partner with me, or I hand Hank your address.",
        effects:[ { flag:"partnered", value:true }, { flag:"threatened_jesse", value:true }, { rel:"jesse", delta:-1 }, { item:"burner_phone", op:"add" } ],
        goto:"ch1_money" },
    ],
  },

  ch1_money: {
    chapter:1,
    text:[
      "Jesse calls you on the cheap prepaid phone he made you buy — \"a burner, yo, rule one\" — and explains, between insults, what a start-up requires in his industry: somewhere private, somewhere mobile. \"Out where nobody's at. We need, like... an RV.\"",
      "Your savings account holds seven thousand dollars: twenty-six years of teaching, minus a life. You take out six of it in an envelope and meet him in a parking lot like a man in someone else's movie.",
    ],
    onEnter:[ { stat:"money", delta:7000 } ],
    choices:[
      { label:"Hand Jesse the envelope and let him handle it.",
        effects:[ { stat:"money", delta:-6000 }, { item:"rv_keys", op:"add" }, { rel:"jesse", delta:1 } ],
        goto:"ch2_card" },
      { label:"Go with him. You don't trust anyone with six thousand dollars.",
        effects:[ { stat:"money", delta:-6000 }, { item:"rv_keys", op:"add" }, { flag:"micromanager", value:true } ],
        goto:"ch2_card" },
    ],
  },

  /* ==================== CHAPTER 2 — THE FIRST COOK ==================== */

  ch2_drive: {
    chapter:2,
    speaker:"jesse",
    text:[
      "The RV smells like mildew and somebody else's bad decisions. Jesse drives it out past the reservation line, two hours into red rock and nothing, narrating the whole way like a tour guide for the end of your old life. \"Rule two: nobody knows where the spot is. Not your wife, not my guys, nobody. Yo, you bring sandwiches?\"",
      "You brought sandwiches. You also brought twenty-six years of discipline, a folding table, and a rage you are only now learning has been there the whole time, idling, like a pilot light.",
    ],
    next:"ch2_cook",
  },

  ch2_cook: {
    chapter:2,
    text:[
      "What happens in the RV that afternoon, you will never describe to anyone — not the steps, not the hours, not the way the work takes you somewhere the cancer can't follow. It is enough to say that you are very, very good at it, and that what comes out at the end makes Jesse go quiet for the first time since you've met him.",
      "\"Yo, Mr. White,\" he says finally, holding the result up to the light like a jeweler. \"You're a damn artist.\"",
      "It's the first compliment anyone has paid your work in a decade. You hate how much it lands.",
    ],
    onEnter:[ { stat:"heat", delta:3 }, { flag:"first_batch", value:true } ],
    choices:[
      { label:"Let Jesse handle the sale. He knows the people; you don't want to.",
        effects:[ { rel:"jesse", delta:1 } ],
        goto:"ch2_dealgone" },
      { label:"Insist on coming along. Your product, your terms.",
        effects:[ { flag:"met_buyers", value:true }, { stat:"heat", delta:4 } ],
        goto:"ch2_dealgone" },
    ],
  },

  ch2_dealgone: {
    chapter:2,
    text:(s)=>[
      s.flags.met_buyers
        ? "The buyers turn out to be exactly who you feared: Emilio — fresh out on bail from the very bust where you sat in Hank's car — and his cousin, a careful, smiling man they call Krazy-8. Emilio stares at you for a long three seconds. \"I know you. You were with the DEA.\""
        : "Jesse comes back pale, with the buyers right behind him: Emilio — fresh out on bail — and his cousin, a careful, smiling man they call Krazy-8. Emilio saw Jesse's new partner from a distance and made a phone call. \"My cousin says your guy was sitting in a fed car at my arrest,\" Krazy-8 says pleasantly.",
      "It goes wrong with astonishing speed. There is a gun, and then there are two guns, and then you are inside the RV with the door blocked and two men explaining, in detail, what happens to people they believe are informants.",
      "You offer them the only thing you have: the work. A demonstration. Your hands are steadier than they have any right to be.",
    ],
    choices:[
      { label:"Improvise something desperate with what's at hand. Don't think. Act.",
        effects:[ { stat:"heat", delta:10 } ],
        goto:"ch2_aftermath" },
      { label:"Give them everything — the batch, the cash, the RV keys. Beg.",
        effects:[ { flag:"gave_in", value:true }, { rel:"jesse", delta:-1 } ],
        goto:"ch2_robbed" },
    ],
  },

  ch2_aftermath: {
    chapter:2,
    text:[
      "You will tell Jesse, later, that you don't want to talk about what you did in those forty seconds, and you will mean it. When the RV door opens again, Emilio doesn't walk out of it, and Krazy-8 is unconscious in the dirt with his future entirely in your hands.",
      "The desert is silent in a way that feels like a witness. Jesse throws up behind a rock, twice, and then helps you anyway. That's the moment you learn what he is: not smart, not careful — loyal.",
      "Emilio you leave to the desert and to chemistry's oldest rule: nothing is ever truly lost, it only changes form. Krazy-8 wakes up zip-tied to a pole in Jesse's basement, and now there is a question down there with him.",
    ],
    next:"ch2_krazy8",
  },

  ch2_krazy8: {
    chapter:2,
    speaker:"walt",
    text:[
      "For three days you bring him sandwiches with the crusts cut off, and beer, and you talk. His real name is Domingo. He used to work at his father's furniture store; you remember the jingle and the two of you sing it, absurdly, in a basement that smells like motor oil. He tells you he won't talk if you let him go. He's persuasive. He may even mean it.",
      "Upstairs, on a notepad, you make a list. One column: reasons to let him live. It fills the page. The other column has one entry, and it is the only entry that has ever mattered to anyone in this business: he will hurt your family.",
    ],
    choices:[
      { label:"Let him go. You are not the man the second column needs you to be.",
        effects:[ { flag:"spared_krazy8", value:true }, { rel:"jesse", delta:-1 } ],
        goto:"ch2_release" },
      { label:"Buy his silence. Every dollar you have left, an apology, and a bus ticket out of state.",
        require:{ stats:{ money:{ gte:1000 } } },
        effects:[ { stat:"money", delta:-1000 }, { flag:"paid_krazy8", value:true } ],
        goto:"ch2_payoff" },
      { label:"The second column. Do what the list says.",
        effects:[ { flag:"crossed_line", value:true }, { stat:"trust", delta:-6 }, { stat:"heat", delta:5 }, { rel:"jesse", delta:1 } ],
        goto:"ch2_hardchoice" },
    ],
  },

  ch2_release: {
    chapter:2,
    text:[
      "You cut the zip tie yourself. Domingo rubs his wrists, looks at you with an expression you'll spend months trying to read — gratitude, contempt, arithmetic — and walks up the basement stairs into the rest of his life.",
      "At the door he stops. \"You're not built for this, walter white.\" He says your name like it's already evidence. Then he's gone, and you have mercy, and mercy has a phone.",
    ],
    next:"ch2_firstcash",
  },

  ch2_payoff: {
    chapter:2,
    text:[
      "He counts the money twice, which you respect. The promise he makes you is the kind both parties agree to believe in because the alternative is worse for everyone.",
      "\"For what it's worth,\" Domingo says at the bus station, not looking at you, \"the product's the best anyone's seen. That's your problem, you know. People are going to come looking for the man who made it.\" The bus sighs and swallows him. You stand there a while with the worst compliment of your life.",
    ],
    next:"ch2_firstcash",
  },

  ch2_hardchoice: {
    chapter:2,
    text:[
      "You do it on a Tuesday, and afterward you sit on the bottom stair for a long time with your glasses in your hand.",
      "There is no version of this you get to take back. You came down the stairs one kind of man, and you will climb them as another, and the house above you — Jesse's dead aunt's house, with its dishes and doilies — goes on being ordinary the way houses do, no matter what their basements learn.",
      "Jesse doesn't say anything when you come up. He hands you a beer. It's the kindest thing anyone's done for you in weeks, and you can never tell anyone why.",
    ],
    next:"ch2_firstcash",
  },

  ch2_robbed: {
    chapter:2,
    text:[
      "They take all of it — the batch, the startup cash, even the folding table — and leave the two of you sitting in the dirt beside an RV they generously decide is too pathetic to steal. Krazy-8's parting advice, delivered like a customer-service survey: \"Stay out of the business. You're not built for it.\"",
      "Jesse doesn't speak on the drive back. The black eye Emilio gave him is closing up like a time-lapse flower. You ran the numbers all the way home: you are now poorer, sicker, and known by name to two violent men. As experiments go, the first trial was not a success.",
    ],
    onEnter:[ { stat:"money", delta:-500 } ],
    next:"ch2_broke",
  },

  ch2_broke: {
    chapter:2,
    text:[
      "The first oncology invoice arrives that Friday in a windowed envelope, the kind that always knows where you live. The number inside has a comma in it and then, insultingly, another one. You move it under the fruit bowl before Skyler sees, where it radiates through the wood like something from one of your old lectures.",
      "Jesse calls the burner that night. \"Yo. So. Round two? Because I know a guy who is not those guys.\" You should say no. The envelope under the fruit bowl says otherwise.",
    ],
    onEnter:[ { stat:"health", delta:-5 }, { stat:"trust", delta:-4 } ],
    next:"ch2_firstcash",
  },

  ch2_firstcash: {
    chapter:2,
    text:(s)=> s.flags.gave_in ? [
      "Round two goes the way round one should have. Jesse's new buyer is a nervous man in a bowling shirt who pays in rubber-banded rolls and refers to you, respectfully, as 'the artist.' On a card table in Jesse's kitchen, you count it into stacks: eight thousand dollars.",
      "It's not the seven hundred grand from Hank's press conference. But you made it in a weekend, with your hands and your mind, and no one graded it on a curve.",
    ] : [
      "Jesse moves the batch in six days through people he won't name, and on the seventh he hands you a gym bag in a diner parking lot like it's nothing, like it's laundry. In the car you count it with the doors locked: eight thousand dollars.",
      "Twenty-six years of teaching never once paid you for a week what this paid you for a weekend. You sit in the driver's seat doing a kind of math that has nothing to do with money, and you notice — clinically, the way you'd note a color change in a flask — that you feel awake.",
    ],
    onEnter:[ { stat:"money", delta:8000 } ],
    next:"ch2_bill",
  },

  ch2_bill: {
    chapter:2,
    text:[
      "Dr. Delcavoli's billing department has the gentle relentlessness of a tide. Treatment starts now or the word 'inoperable' starts doing overtime. The options come laminated: the full protocol, the partial protocol, and the one nobody laminates — walking out.",
      "Skyler sits beside you in the consultation holding her purse on her lap like a shield. Whatever you choose, you'll be choosing it twice: once in this room, and once at home, in the story you tell about how it's being paid for.",
    ],
    choices:[
      { label:"The full protocol. The best they have.",
        require:{ stats:{ money:{ gte:5000 } } },
        effects:[ { stat:"money", delta:-5000 }, { stat:"health", delta:12 } ],
        goto:"ch2_skyler" },
      { label:"The partial protocol. Enough to fight, not enough to bankrupt.",
        require:{ stats:{ money:{ gte:1500 } } },
        effects:[ { stat:"money", delta:-1500 }, { stat:"health", delta:5 } ],
        goto:"ch2_skyler" },
      { label:"Defer treatment. You need the money working, not spent.",
        effects:[ { stat:"health", delta:-8 }, { stat:"trust", delta:-5 }, { flag:"skipped_treatment", value:true } ],
        goto:"ch2_skyler" },
    ],
  },

  ch2_skyler: {
    chapter:2,
    speaker:"skyler",
    text:[
      "\"There's a second cell phone.\" Skyler says it to the mirror while taking off her earrings, casually, the way she'd mention a leaking faucet. \"It rings, and you go to the garage. And on Saturday you smelled like cigarettes, and you don't smoke, and we both know you didn't go to your mother's.\"",
      "She turns around. Seven months pregnant, arms folded on top of everything. \"I'm not accusing you, Walt. I'm giving you a chance to be the one who tells me.\"",
    ],
    choices:[
      { label:"A second job. Off the books, at the car wash. For the bills.",
        effects:[ { stat:"trust", delta:-10 } ],
        goto:"ch3_card" },
      { label:"Snap at her. You're the one who's sick; you're owed some air.",
        effects:[ { stat:"trust", delta:-15 }, { rel:"skyler", delta:-1 } ],
        goto:"ch3_card" },
      { label:"A half-truth: you've been arranging money for the treatment. Quietly. Legally-ish.",
        effects:[ { stat:"trust", delta:-5 }, { flag:"sliver_truth", value:true } ],
        goto:"ch3_card" },
    ],
  },

  /* ==================== CHAPTER 3 — LIES AT HOME ==================== */

  ch3_intervention: {
    chapter:3,
    text:[
      "Skyler organizes a family meeting with an agenda and a talking pillow. Whoever holds the pillow speaks; everyone else listens. Marie holds it and talks about quality of life. Hank holds it and talks, badly, about courage, and has to look at the ceiling for a while. Walt Jr. holds it and says you're a pussy if you don't fight, and nobody corrects his language because he's right and he's crying.",
      "Then the pillow comes to you. The room arranges itself around your answer: four faces, one future each, all of them yours to spend.",
    ],
    choices:[
      { label:"Promise them the treatment. All of it. Whatever it costs.",
        effects:[ { stat:"trust", delta:10 }, { rel:"waltjr", delta:1 }, { flag:"promised_fight", value:true } ],
        goto:"ch3_chemo" },
      { label:"Tell the truth for once: it's your death, and you'll decide how you meet it.",
        effects:[ { stat:"trust", delta:-10 }, { rel:"skyler", delta:-1 }, { flag:"own_terms", value:true } ],
        goto:"ch3_chemo" },
    ],
  },

  ch3_chemo: {
    chapter:3,
    text:[
      "Treatment days have a rhythm: the recliner, the IV, the daytime television where everyone is shouting about paternity. Your hair starts letting go in the shower, undramatically, like an employee giving notice.",
      "You shave the rest yourself, and the man in the mirror is a stranger with your eyes — harder, simpler, somehow more true. On the walk home you pass a menswear store, and in the window, on a faceless head, sits a black pork-pie hat.",
    ],
    onEnter:[ { stat:"health", delta:4 }, { stat:"money", delta:-1000 } ],
    choices:[
      { label:"Buy the hat. It fits the stranger perfectly.",
        effects:[ { item:"heisenberg_hat", op:"add" } ],
        goto:"ch3_money" },
      { label:"Keep walking. You don't need a costume; you need a plan.",
        goto:"ch3_money" },
    ],
  },

  ch3_money: {
    chapter:3,
    text:[
      "Money is now arriving faster than a teacher's salary can explain, and Skyler does the family books. The gap between what you make and what you spend has become a room in the house: everyone walks around it.",
      "It needs a story. Stories, you are learning, are like product: purity matters, and the cut-rate ones get people hurt.",
    ],
    choices:[
      { label:"A gambling story. Blackjack, card counting — a shameful, taxable hot streak.",
        effects:[ { stat:"trust", delta:-8 }, { flag:"gambling_story", value:true } ],
        goto:"ch3_hank" },
      { label:"Tell her Elliott and Gretchen are quietly paying for everything.",
        effects:[ { stat:"trust", delta:-5 }, { flag:"elliott_lie", value:true } ],
        goto:"ch3_hank" },
      { label:"Hire the lawyer Jesse keeps mentioning. The one from the bus benches.",
        require:{ stats:{ money:{ gte:4000 } }, items:["burner_phone"] },
        hint:"Requires $4,000 and the Burner Phone",
        effects:[ { stat:"money", delta:-4000 } ],
        goto:"ch3_saul" },
    ],
  },

  ch3_saul: {
    chapter:3,
    speaker:"saul",
    text:[
      "The office is in a strip mall between a nail salon and a vacuum repair shop, and the Constitution on the wall is inflatable. Saul Goodman talks for eleven uninterrupted minutes, during which he correctly guesses your business, your problem, your brother-in-law's employer, and your shoe size.",
      "\"Here's the deal, Mont Blanc. You don't need a criminal lawyer. You need a *criminal* lawyer.\" For four grand he builds you a story with a paper skeleton: a consulting LLC, invoices, a car wash that may soon develop a surprisingly profitable relationship with cash. \"Congratulations,\" he says, handing you his card. \"You're a small business owner. Try the nail salon, tell 'em Saul sent you.\"",
    ],
    onEnter:[ { item:"sauls_card", op:"add" }, { rel:"saul", delta:2 }, { flag:"laundered", value:true } ],
    next:"ch3_hank",
  },

  ch3_hank: {
    chapter:3,
    speaker:"hank",
    text:[
      "Poker night at Hank's. Between hands he talks shop, because Hank always talks shop: \"There's a new player in town. Product like nobody's seen — and no name, no face, no nothing. Guy's a ghost.\" He says it with the offended admiration of a fisherman describing the one that's still out there.",
      "He looks at you over his cards. \"You believe that? Some genius out there right now, and me sitting here losing to a chemistry teacher.\" He laughs. Marie laughs. Skyler laughs. You fold a winning hand just to have something to do with your face.",
    ],
    choices:[
      { label:"Play dumb. Change the subject to the baby.",
        effects:[ { stat:"heat", delta:3 } ],
        goto:"ch3_marie" },
      { label:"Ask careful, fascinated questions. Know what he knows.",
        effects:[ { stat:"heat", delta:-5 }, { rel:"hank", delta:1 }, { flag:"pumped_hank", value:true } ],
        goto:"ch3_marie" },
    ],
  },

  ch3_marie: {
    chapter:3,
    speaker:"marie",
    text:[
      "Marie gives Skyler a white-gold baby tiara, for the baby, which is a sentence that only makes sense in Marie's world. It still has the security tag. Skyler, returning it, is nearly arrested, and the resulting sister-quake hits your kitchen at dinnertime: Marie on the phone, Skyler white-knuckled, the word 'shoplifting' hissed like a chemical hazard.",
      "Skyler hangs up and looks at you, eight months of pregnancy and one month of your lies behind her eyes. \"Well? Say something.\"",
    ],
    choices:[
      { label:"Take her side completely. Marie was wrong, full stop.",
        effects:[ { stat:"trust", delta:6 }, { rel:"marie", delta:-1 }, { rel:"skyler", delta:1 } ],
        goto:"ch3_jesse" },
      { label:"Smooth it over. Family is family; everyone keeps secrets they shouldn't.",
        effects:[ { rel:"marie", delta:1 }, { stat:"trust", delta:-3 } ],
        goto:"ch3_jesse" },
    ],
  },

  ch3_jesse: {
    chapter:3,
    speaker:"jesse",
    text:[
      "Jesse's parents have formally evicted him from his own dead aunt's house — lawyers, a letter, the works. He tells you this in the RV with the practiced lightness of a kid who's been thrown away before and has a routine for it. \"Whatever, yo. I'll figure it out. I always figure it out.\"",
      "He's your partner. He's also twenty-four, sleeping in a vehicle that smells like your second life, and the only person on earth who knows both of your names.",
    ],
    choices:[
      { label:"Front him the deposit on his own place. Partners don't sleep in the office.",
        require:{ stats:{ money:{ gte:2500 } } },
        effects:[ { stat:"money", delta:-2500 }, { rel:"jesse", delta:2 } ],
        goto:"ch3_skylerfind" },
      { label:"Keep it business. Sympathy is a cost center.",
        effects:[ { rel:"jesse", delta:-1 } ],
        goto:"ch3_skylerfind" },
    ],
  },

  ch3_skylerfind: {
    chapter:3,
    speaker:"skyler",
    text:(s)=>[
      "It was the dryer. Of all things — the dryer, with its one job. Skyler is holding the lint trap in one hand and a banded brick of twenties in the other, and the laundry room is suddenly the smallest room that has ever existed.",
      s.flags.gambling_story
        ? "\"Blackjack.\" She says your own story back to you with air quotes she doesn't need her hands for. \"Walt. Nobody wins this much at blackjack and hides it in the dryer.\""
        : "\"Start talking,\" she says, \"and be advised: I have held this family together with coupons. I know exactly what money looks like when it's lying.\"",
    ],
    choices:[
      { label:"Give her a sliver of truth: cash deals, gray-market consulting, all of it for the treatment.",
        effects:[ { stat:"trust", delta:-4 }, { flag:"sliver_truth", value:true } ],
        goto:"ch3_close" },
      { label:"Double down. The story is the story. Stick to it, louder.",
        effects:[ { stat:"trust", delta:-14 }, { rel:"skyler", delta:-1 } ],
        goto:"ch3_close" },
      { label:"Hand her Saul's number. There's an LLC. There are invoices. It's boring, really.",
        require:{ items:["sauls_card"] },
        effects:[ { stat:"trust", delta:-4 } ],
        goto:"ch3_close" },
    ],
  },

  ch3_close: {
    chapter:3,
    speaker:"waltjr",
    text:[
      "Saturday morning, before anyone else is up, your son makes you breakfast. The eggs are terrible. He's so proud of them that they're also, somehow, not.",
      "\"After,\" he says — he's started dividing time like that, before and after, like everyone does now — \"after, when you're better, you're teaching me to drive. Dad. You promised. Stick shift.\" He grins his crooked grin, and for ten entire minutes the only thing you are is his father, and the eggs are terrible, and you eat every bite.",
    ],
    onEnter:[ { stat:"trust", delta:6 }, { rel:"waltjr", delta:1 } ],
    next:"ch4_card",
  },

  /* ==================== CHAPTER 4 — EXPANSION ==================== */

  ch4_stall: {

    speaker:"jesse",
    text:[
      "\"We got a distribution problem, yo.\" Jesse spreads crumpled bills across the card table like a losing hand. \"My guys can move ounces. Ounces. We are sitting on a product people would kill for and we're selling it like girl scout cookies.\"",
      "He's right, and the math is merciless: at this rate, the treatment eats the profit and the clock eats the rest. There is a name nobody at this table wants to say. A distributor. The kind with territory, with soldiers, with a temper that has its own reputation. Tuco.",

        hint:"Jesse won't risk it — not for you, not yet",
        goto:"ch4_tuco_jesse" },
      { label:"Stay small. Slow money is still money, and nobody's shooting at it.",

  ch4_tuco_self: {
    chapter:4,
    speaker:"tuco",
    text:[
      "Tuco Salamanca operates out of an office above a mattress store, and the first thing he does is rob you. The second thing he does is laugh about it, with his crew, while you stand there in your windbreaker holding an empty bag. \"Tight tight tight! You got anything else for me, old man?\"",
      "You come back the next day. Same stairs, same crew, same Tuco — but the man who walks in is wearing a black hat, carries a small bag he handles very carefully, and introduces himself with a name you made up on the drive over: Heisenberg.",
      "\"Heisenberg,\" Tuco repeats, tasting it. \"Okay. That's a cool name. So what's in the bag, Heisenberg?\"",
    ],
    choices:[
      { label:"Show him exactly what's in the bag. A demonstration of consequences.",
        effects:[ { flag:"heisenberg", value:true }, { flag:"met_tuco", value:true }, { stat:"money", delta:12000 },
                  { stat:"heat", delta:20 }, { rel:"tuco", delta:2 }, { item:"heisenberg_hat", op:"add" } ],
        goto:"ch4_aftermath" },
      { label:"Lose your nerve. Negotiate small, take his insulting first number.",
        effects:[ { flag:"met_tuco", value:true }, { stat:"money", delta:4000 }, { stat:"heat", delta:8 }, { rel:"tuco", delta:-1 } ],
        goto:"ch4_aftermath" },
    ],
  },

  ch4_tuco_jesse: {
    chapter:4,
    text:[
      "Jesse insists on taking the meet alone — \"No offense, but you look like a substitute teacher, yo, you'll get us both killed\" — and for six hours the burner doesn't ring.",
      "When it finally does, it isn't Jesse. It's a hospital. Tuco took the product as a 'consignment,' took Jesse's objection personally, and put him through a door. Two broken ribs, a face like spoiled fruit, and a deal that now consists of you having been robbed by a man with a reputation to protect.",
    ],
    onEnter:[ { rel:"jesse", delta:0 } ],
    choices:[
      { label:"Cover Jesse's hospital bills. Every cent, no discussion.",
        require:{ stats:{ money:{ gte:3000 } } },
        effects:[ { stat:"money", delta:-3000 }, { rel:"jesse", delta:2 } ],
        goto:"ch4_revenge" },
      { label:"Send word that it's the cost of doing business. Sentiment is expensive.",
        effects:[ { rel:"jesse", delta:-2 }, { stat:"trust", delta:-3 } ],
        goto:"ch4_revenge" },
    ],
  },

  ch4_revenge: {
    chapter:4,
    speaker:"tuco",
    text:[

      "The lawyers are civil. The word they keep using is 'irreconcilable,' which you find imprecise. Things were reconciled fine until you reconciled them into the ground. You see your son every other Saturday at a restaurant where he orders the same thing and answers in the same three words.",
      "You did all of it for the family. You say that to the empty house, and the house, which has heard everything now, says nothing back.",
    ],
  },

  end_empire: {
    type:"ending", endingId:"empire", title:"The Empire Business",
    text:(s)=>[
      "Tuco's territory becomes your territory, the way a river takes a field: quietly, completely, while everyone argues about fences. The product — yours, unsigned, unmistakable — moves through three states. Men you've never met are afraid of a name you made up in a desert.",
      "The money stops being money. It becomes weight, volume, a storage problem. You solve it the way you solve everything now: precisely, and without asking anyone.",
      s.stats.trust >= 40
        ? "At home you are gray, mild, punctual — a man who got lucky with a gambling system, who pays for everything in cashier's checks and silence. Skyler has decided not to look directly at the sun of it. The lie holds because everyone needs it to. You sit at your own dinner table like a spy in your own life, and you have never felt more awake."
        : "Home is a place you visit, briefly, like a man checking on a property. They flinch when you're cheerful now. They don't know what you are, only that you are no longer what you were. You tell yourself the distance keeps them safe. You're half right.",
      "You were given two years. You no longer think about it. Whatever is growing in you will have to wait its turn — you are in the empire business, and business is good.",
    ],
  },

  end_time: {
    type:"ending", endingId:"time", title:"Time Runs Out",
    text:(s)=>[
      "In the end it isn't the DEA, or Tuco, or the lies. It's the thing that started all of it, keeping its original appointment.",
      "The hospital room fills and empties on a tide of family. Machines keep their gentle, idiot rhythm.",
      s.stats.money >= 25000 && s.stats.trust >= 40
        ? "The money is real, at least — found, laundered into legitimacy, enough for the house and the college funds and the baby. Skyler holds your hand and you let yourself believe the accounting works out: that what you paid was worth what they keep."
        : s.stats.money >= 25000
          ? "The money is there — hidden, abundant, useless. You never worked out how to hand it to them without handing them the truth, and now there's no time to launder anything, least of all yourself."
          : "There was supposed to be money. That was the entire point, the equation that justified everything. The equation never balanced. You ran out of time the way you ran out of everything else: with the work half-finished.",
      "Your last clear thought is of a classroom — chalk dust in afternoon light, a roomful of bored faces, and you at the board, trying one more time to explain that nothing is ever truly lost. It only changes form.",
    ],
  },

  end_out_clean: {
    type:"ending", endingId:"clean", title:"Out Clean",
    text:(s)=>[
      "You stop. That's the whole trick, the one almost nobody manages: you stop while stopping is still a thing that can be done.",
      "Jesse takes the news with a shrug too elaborate to be real. The RV is sold to a man in Gallup who asks no questions. The burner dies in pieces in three different dumpsters, and the desert keeps what the desert knows.",
      `The money — ${"$"+s.stats.money.toLocaleString()} after Saul's arithmetic — becomes a story about card counting and a hot streak, and then it just becomes the mortgage, the treatment, the college fund. Boring. Sacred.`,
      s.stats.health >= 50
        ? "At the next scan the oncologist uses the word 'remission' with professional caution, and Skyler cries in the car, and you sit there in the passenger seat of your own rescued life, learning to be a man with time again."
        : "The scans aren't good, but they aren't a sentence either — they're a schedule. Whatever time the treatment buys, you spend it at home, where everyone knows your name and nobody knows your alias.",
      "Some nights you still feel it: the version of you that wouldn't have stopped, pacing behind the glass of might-have-been. You nod to him. You leave him there.",
    ],
  },

  },
};

/* ============================================================
   SECTION 2: ENGINE
   ============================================================ */

const $ = (id)=>document.getElementById(id);

function freshState(){
  return {
    v:1,
    scene:STORY.start,
    stats:{ money:0, heat:0, trust:70, health:70 },
    rels:{ skyler:2, jesse:0, hank:2, marie:1, waltjr:3, saul:0, tuco:0 },
    inventory:[],
    flags:{},
    firedEvents:[],
    usedRescues:[],
    pending:null,   // scene to return to after a rescue
    resume:null,    // scene to return to after a random event
    history:[],
  };
}
let state = freshState();

/* ---------- conditions ---------- */
function checkRequire(req){
  if (!req) return { ok:true, hints:[] };
  const hints = [];
  if (req.stats) for (const k in req.stats){
    const c = req.stats[k], v = state.stats[k];
    if (c.gte !== undefined && v < c.gte)
      hints.push(k==="money" ? "Requires $"+c.gte.toLocaleString() : "Requires "+STATS_META[k].label+" ≥ "+c.gte);
    if (c.lte !== undefined && v > c.lte)
      hints.push("Requires "+STATS_META[k].label+" ≤ "+c.lte);
  }
  if (req.items) for (const it of req.items){
    if (!state.inventory.includes(it)) hints.push("Requires "+(ITEMS[it]?ITEMS[it].name:it));
  }
  if (req.flags) for (const f in req.flags){
    if (Boolean(state.flags[f]) !== Boolean(req.flags[f])) hints.push(null); // story-secret: no hint text
  }
  if (req.rels) for (const r in req.rels){
    const c = req.rels[r], v = state.rels[r] ?? 0;
    if (c.gte !== undefined && v < c.gte) hints.push("Requires "+(CHARACTERS[r]?CHARACTERS[r].name:r)+"'s trust");
    if (c.lte !== undefined && v > c.lte) hints.push(null);
  }
  return { ok:hints.length===0, hints:hints.filter(Boolean) };
}

/* ---------- effects ---------- */
function applyEffects(list){
  if (!list) return;
  const deltas = [];
  for (const e of list){
    if (e.stat){
      const m = STATS_META[e.stat];
      const before = state.stats[e.stat];
      let after = (e.set !== undefined) ? e.set : before + e.delta;
      after = Math.max(m.min, Math.min(m.max, after));
      state.stats[e.stat] = after;
      if (after !== before) deltas.push({ stat:e.stat, d:after-before });
    } else if (e.rel){
      const before = state.rels[e.rel] ?? 0;
      state.rels[e.rel] = Math.max(-3, Math.min(3, before + e.delta));
    } else if (e.item){
      if (e.op === "add" && !state.inventory.includes(e.item)) state.inventory.push(e.item);
      if (e.op === "remove") state.inventory = state.inventory.filter(i=>i!==e.item);
    } else if (e.flag !== undefined){
      state.flags[e.flag] = e.value;
    }
  }
  renderHUD(deltas);
  renderInventory();
}

/* ---------- interrupts: stat thresholds ---------- */
function checkInterrupt(targetId){
  const sc = STORY.scenes[targetId];
  if (!sc || sc.type === "ending" || sc.noInterrupt) return null;
  if (state.stats.health <= 0) return "end_time";
  if (state.stats.heat >= 100){
    if (state.usedRescues.includes("dea")) return "end_caught";
    state.usedRescues.push("dea");
    state.pending = targetId;
    return "rescue_dea";
  }
  if (state.stats.trust <= 0){
    if (state.usedRescues.includes("family")) return "end_family";
    state.usedRescues.push("family");
    state.pending = targetId;
    return "rescue_family";
  }
  return null;
}

/* ---------- random events ---------- */
function pickRandomEvent(){
  const pool = EVENTS.filter(ev=>{
    if (ev.once && state.firedEvents.includes(ev.id)) return false;
    return checkRequire(ev.require).ok;
  });
  const weights = pool.map(ev => typeof ev.weight === "function" ? ev.weight(state) : (ev.weight ?? 1));
  const total = weights.reduce((a,b)=>a+b, NO_EVENT_WEIGHT);
  let roll = Math.random() * total;
  for (let i=0;i<pool.length;i++){
    if (roll < weights[i]) return pool[i];
    roll -= weights[i];
  }
  return null; // landed in the no-event slice
}

/* ---------- state machine ---------- */
function goTo(id, opts){
  opts = opts || {};
  if (id === "@pending"){
    // returning from a rescue: the target's onEnter already ran before the interrupt
    id = state.pending || STORY.start; state.pending = null; opts.skipOnEnter = true;
  }
  if (id === "@resume"){
    id = state.resume || STORY.start; state.resume = null;
  }
  const sc = STORY.scenes[id];
  if (!sc){ console.error("Missing scene:", id); return; }
  if (!opts.skipOnEnter) applyEffects(sc.onEnter);
  const intr = checkInterrupt(id);
  if (intr) return goTo(intr);
  state.scene = id;
  state.history.push(id);
  if (state.history.length > 30) state.history.shift();
  if (sc.type === "chapter") renderChapterCard(sc);
  else if (sc.type === "ending") renderEnding(sc);
  else renderScene(sc);
}

function chooseOption(choice){
  applyEffects(choice.effects);
  const target = typeof choice.goto === "function" ? choice.goto(state) : choice.goto;
  goTo(target);
}

function advanceFromChapter(sc){
  hideOverlay();
  if (sc.events){
    const ev = pickRandomEvent();
    if (ev){
      state.firedEvents.push(ev.id);
      state.resume = sc.next;
      return goTo(ev.scene);
    }
  }
  goTo(sc.next);
}

/* ---------- rendering: HUD + inventory ---------- */
function fmtMoney(n){ return "$" + n.toLocaleString(); }

function renderHUD(deltas){
  $("v-money").textContent = fmtMoney(state.stats.money);
  $("v-heat").textContent = state.stats.heat;
  $("v-trust").textContent = state.stats.trust;
  $("v-health").textContent = state.stats.health;
  for (const k of ["money","heat","trust","health"]){
    const m = STATS_META[k];
    const pct = Math.min(100, (state.stats[k]/m.barMax)*100);
    $("b-"+k).style.width = pct + "%";
    const pill = document.querySelector('.pill[data-stat="'+k+'"]');
    const warn = (m.warnHigh !== undefined && state.stats[k] >= m.warnHigh) ||
                 (m.warnLow !== undefined && state.stats[k] <= m.warnLow);
    pill.classList.toggle("warn", warn);
  }
  if (deltas) for (const d of deltas){
    const pill = document.querySelector('.pill[data-stat="'+d.stat+'"]');
    pill.classList.remove("pulse"); void pill.offsetWidth; pill.classList.add("pulse");
    const span = document.createElement("span");
    span.className = "delta " + (d.d > 0 ? "up" : "down");
    span.textContent = (d.d > 0 ? "+" : "−") + (d.stat === "money" ? "$"+Math.abs(d.d).toLocaleString() : Math.abs(d.d));
    pill.appendChild(span);
    setTimeout(()=>span.remove(), 1400);
  }
}

function renderInventory(){
  const html = state.inventory.length
    ? state.inventory.map(id=>{
        const it = ITEMS[id] || { name:id, desc:"" };
        return "<li><b>"+it.name+"</b><span>"+it.desc+"</span></li>";
      }).join("")
    : '<li class="inv-empty" style="border:none;background:none">Empty pockets.</li>';
  $("invDesktop").innerHTML = html;
  $("invSheet").innerHTML = html;
}

/* ---------- rendering: scenes + typewriter ---------- */
const tw = { items:[], idx:0, pos:0, timer:null, done:true };

function sceneParagraphs(sc){
  let t = typeof sc.text === "function" ? sc.text(state) : sc.text;
  if (typeof t === "string") t = [t];
  return (t || []).filter(Boolean);
}

function renderScene(sc){
  const narr = $("narrative");
  narr.classList.add("fade");
  setTimeout(()=>{
    const sp = $("speaker");
    if (sc.speaker && CHARACTERS[sc.speaker]){
      sp.textContent = CHARACTERS[sc.speaker].name;
      sp.style.color = CHARACTERS[sc.speaker].color;
      sp.className = "on";
    } else sp.className = "";
    startTypewriter(sceneParagraphs(sc));
    renderChoices(sc);
    narr.classList.remove("fade");
    narr.scrollTop = 0;
  }, 250);
}

function startTypewriter(paras){
  stopTypewriter();
  const box = $("sceneText");
  box.innerHTML = "";
  tw.items = paras.map(text=>{
    const p = document.createElement("p");
    box.appendChild(p);
    return { p, text };
  });
  tw.idx = 0; tw.pos = 0; tw.done = false;
  $("skipHint").style.opacity = .6;
  tw.timer = setInterval(stepTypewriter, 14);
}

function stepTypewriter(){
  let budget = 2; // chars per tick
  while (budget-- > 0){
    if (tw.idx >= tw.items.length) return finishTypewriter();
    const item = tw.items[tw.idx];
    tw.pos++;
    if (tw.pos >= item.text.length){
      item.p.textContent = item.text;
      item.p.classList.remove("cursor");
      tw.idx++; tw.pos = 0;
    } else {
      item.p.textContent = item.text.slice(0, tw.pos);
      item.p.classList.add("cursor");
    }
  }
  const cur = tw.items[tw.idx];
  if (cur && cur.p.getBoundingClientRect().bottom > window.innerHeight)
    cur.p.scrollIntoView({ block:"end" });
}

function stopTypewriter(){
  if (tw.timer){ clearInterval(tw.timer); tw.timer = null; }
}

function finishTypewriter(){
  stopTypewriter();
  if (tw.done) return;
  tw.done = true;
  for (const it of tw.items){ it.p.textContent = it.text; it.p.classList.remove("cursor"); }
  $("skipHint").style.opacity = 0;
  revealChoices();
}

function skipTypewriter(){
  if (!tw.done) finishTypewriter();
}

/* ---------- rendering: choices ---------- */
function renderChoices(sc){
  const box = $("choices");
  box.innerHTML = "";
  const entries = sc.choices
    ? sc.choices.slice()
    : [{ label:"Continue", goto:sc.next, _continue:true }];
  for (const ch of entries){
    const res = checkRequire(ch.require);
    if (!res.ok && ch.hidden) continue;
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = '<span class="arrow">▸</span>' + escapeHtml(ch.label);
    if (!res.ok){
      btn.disabled = true;
      const hint = ch.hint || res.hints[0] || "Not available";
      btn.innerHTML += '<span class="hint">'+escapeHtml(hint)+'</span>';
    } else {
      btn.addEventListener("click", ()=>chooseOption(ch));
    }
    box.appendChild(btn);
  }
}

function revealChoices(){
  const btns = $("choices").querySelectorAll(".choice");
  btns.forEach((b,i)=> setTimeout(()=>b.classList.add("show"), 80*i));
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------- rendering: chapter + ending cards ---------- */
const ENDING_TONE = { walk_away:"end-peace", clean:"end-peace", caught:"end-doom", family:"end-doom", time:"end-doom", empire:"end-empire" };

function showOverlay(tone){
  const ov = $("overlay");
  ov.className = "on fadein" + (tone ? " "+tone : "");
}
function hideOverlay(){ $("overlay").className = ""; }

function renderChapterCard(sc){
  $("cardKicker").textContent = "Chapter " + ["","One","Two","Three","Four","Five"][sc.chapter];
  $("cardTitle").textContent = sc.title;
  $("cardBody").innerHTML = "";
  $("cardStats").innerHTML = "";
  const btn = $("cardBtn");
  btn.textContent = "Continue";
  btn.onclick = ()=>advanceFromChapter(sc);
  showOverlay();
}

function renderEnding(sc){
  $("cardKicker").textContent = "An Ending";
  $("cardTitle").textContent = sc.title;
  $("cardBody").innerHTML = sceneParagraphs(sc).map(p=>"<p>"+escapeHtml(p)+"</p>").join("");
  $("cardStats").innerHTML =
    "Final tally — Money: <b>"+fmtMoney(state.stats.money)+"</b> · Heat: "+state.stats.heat+
    " · Family: "+state.stats.trust+" · Health: "+state.stats.health;
  const btn = $("cardBtn");
  btn.textContent = "Play Again";
  btn.onclick = ()=>{ state = freshState(); hideOverlay(); renderAll(); goTo(STORY.start); };
  showOverlay(ENDING_TONE[sc.endingId] || "");
}

/* ---------- save / load ---------- */
function exportSave(){
  return btoa(encodeURIComponent(JSON.stringify(state)));
}

function importSave(code){
  if (typeof code !== "string" || !code.trim()) return { ok:false, msg:"That save code is empty." };
  let json, data;
  try { json = decodeURIComponent(atob(code.trim())); }
  catch(e){ return { ok:false, msg:"That doesn't look like a valid save code." }; }
  try { data = JSON.parse(json); }
  catch(e){ return { ok:false, msg:"Save code is corrupted — couldn't read it." }; }
  if (!data || typeof data !== "object") return { ok:false, msg:"Save code is corrupted — wrong format." };
  if (data.v !== 1) return { ok:false, msg:"Save code is from an incompatible version." };
  if (typeof data.scene !== "string" || !STORY.scenes[data.scene])
    return { ok:false, msg:"Save code points to an unknown scene." };

  // rebuild onto a fresh state: unknown keys are dropped, bad values clamped
  const st = freshState();
  st.scene = data.scene;
  if (data.stats && typeof data.stats === "object")
    for (const k in st.stats){
      const v = Number(data.stats[k]);
      if (Number.isFinite(v)){
        const m = STATS_META[k];
        st.stats[k] = Math.max(m.min, Math.min(m.max === Infinity ? 9999999 : m.max, Math.round(v)));
      }
    }
  if (data.rels && typeof data.rels === "object")
    for (const k in st.rels){
      const v = Number(data.rels[k]);
      if (Number.isFinite(v)) st.rels[k] = Math.max(-3, Math.min(3, Math.round(v)));
    }
  if (Array.isArray(data.inventory))
    st.inventory = data.inventory.filter(i=> typeof i === "string" && Object.prototype.hasOwnProperty.call(ITEMS, i));
  if (data.flags && typeof data.flags === "object")
    for (const f in data.flags) if (typeof f === "string") st.flags[f] = Boolean(data.flags[f]);
  if (Array.isArray(data.firedEvents))
    st.firedEvents = data.firedEvents.filter(i=> typeof i === "string");
  if (Array.isArray(data.usedRescues))
    st.usedRescues = data.usedRescues.filter(i=> i === "dea" || i === "family");
  if (typeof data.pending === "string" && STORY.scenes[data.pending]) st.pending = data.pending;
  if (typeof data.resume === "string" && STORY.scenes[data.resume]) st.resume = data.resume;
  if (Array.isArray(data.history))
    st.history = data.history.filter(i=> typeof i === "string").slice(-30);

  state = st;
  return { ok:true, msg:"Save loaded. Welcome back." };
}

/* ---------- save modal wiring ---------- */
function openSaveModal(){
  closeSheet();
  $("saveOut").value = exportSave();
  $("saveIn").value = "";
  setSaveMsg("", "");
  $("saveModal").classList.add("on");
}
function closeSaveModal(){ $("saveModal").classList.remove("on"); }
function setSaveMsg(msg, cls){ const el = $("saveMsg"); el.textContent = msg; el.className = cls; }

function copySaveCode(){
  const ta = $("saveOut");
  const done = ()=>setSaveMsg("Copied to clipboard.", "ok");
  const manual = ()=>{ ta.focus(); ta.select(); setSaveMsg("Press and hold / Ctrl+C to copy the selected code.", "ok"); };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(ta.value).then(done, manual);
  else manual();
}

function loadFromInput(){
  const res = importSave($("saveIn").value);
  setSaveMsg(res.msg, res.ok ? "ok" : "err");
  if (res.ok){
    setTimeout(()=>{
      closeSaveModal();
      hideOverlay();
      renderAll();
      goTo(state.scene, { skipOnEnter:true });
    }, 600);
  }
}

/* ---------- sheet (mobile inventory) ---------- */
function openSheet(){ $("sheet").classList.add("open"); $("scrim").classList.add("on"); }
function closeSheet(){ $("sheet").classList.remove("open"); $("scrim").classList.remove("on"); }

/* ============================================================
   SECTION 3: BOOT
   ============================================================ */
function renderAll(){ renderHUD(); renderInventory(); }

document.addEventListener("DOMContentLoaded", ()=>{
  $("narrative").addEventListener("click", skipTypewriter);
  $("bagBtn").addEventListener("click", openSheet);
  $("sheetClose").addEventListener("click", closeSheet);
  $("scrim").addEventListener("click", closeSheet);
  document.querySelectorAll("[data-open-save]").forEach(b=>b.addEventListener("click", openSaveModal));
  $("copyBtn").addEventListener("click", copySaveCode);
  $("loadBtn").addEventListener("click", loadFromInput);
  $("closeSave").addEventListener("click", closeSaveModal);
  renderAll();
  goTo(STORY.start);
});

// debug handle (used during development; harmless to keep)
window.game = { get state(){ return state; }, goTo, importSave, exportSave };
</script>
